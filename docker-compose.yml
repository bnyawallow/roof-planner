services:
  roofplanner:
    image: ghcr.io/bnyawallow/roofplanner:latest
    container_name: roofplanner
    environment:
      NODE_ENV: production
      PORT: 3000
      # APP_BASE_URL: https://roofplanner.creativefringe.digital
      # MPESA_ENVIRONMENT: sandbox
      # MPESA_CONSUMER_KEY: ""
      # MPESA_CONSUMER_SECRET: ""
      # MPESA_PASSKEY: ""
      # MPESA_SHORTCODE: ""
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fringebuilder.rule=Host(`roofplanner.creativefringe.digital`)"
      - "traefik.http.routers.fringebuilder.entrypoints=websecure"
      - "traefik.http.routers.fringebuilder.tls=true"
      - "traefik.http.services.fringebuilder.loadbalancer.server.port=3000"
    restart: unless-stopped
